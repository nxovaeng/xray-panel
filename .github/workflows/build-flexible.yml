name: Flexible Build

# 手动触发，可按需选择平台/架构，用于测试或发布特定组合。
# 正式发版请使用 release.yml。

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v0.0.0-dev'
      architectures:
        description: 'Architectures to build'
        required: true
        type: choice
        options:
          - both        # amd64 + arm64
          - amd64-only
          - arm64-only
        default: 'both'
      create_release:
        description: 'Create GitHub Release after build'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set build matrix
        id: set-matrix
        run: |
          case "${{ github.event.inputs.architectures }}" in
            both)       ARCHS="amd64 arm64" ;;
            amd64-only) ARCHS="amd64" ;;
            arm64-only) ARCHS="arm64" ;;
          esac

          JSON='{"arch":['
          FIRST=true
          for arch in $ARCHS; do
            [ "$FIRST" = true ] && FIRST=false || JSON+=','
            JSON+="\"$arch\""
          done
          JSON+=']}'

          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          echo "Build matrix: $JSON"

  build:
    name: Build linux-${{ matrix.arch }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          go build -trimpath \
            -ldflags="-s -w \
              -X main.Version=${{ github.event.inputs.version }} \
              -X main.BuildTime=${BUILD_TIME}" \
            -o "dist/panel-linux-${{ matrix.arch }}" \
            ./cmd/panel
          echo "Binary size: $(du -sh dist/panel-linux-${{ matrix.arch }} | cut -f1)"

      - name: Package
        run: |
          VERSION="${{ github.event.inputs.version }}"
          ARCH="${{ matrix.arch }}"
          PKG="xray-panel-${VERSION}-linux-${ARCH}"

          mkdir -p "dist/${PKG}/conf" "dist/${PKG}/scripts"

          cp "dist/panel-linux-${ARCH}" "dist/${PKG}/"
          chmod +x "dist/${PKG}/panel-linux-${ARCH}"

          cp conf/config.yaml.example "dist/${PKG}/conf/"

          cp scripts/install.sh "dist/${PKG}/scripts/"
          chmod +x "dist/${PKG}/scripts/install.sh"

          cp xray-panel.sh "dist/${PKG}/"
          chmod +x "dist/${PKG}/xray-panel.sh"

          cp README.md "dist/${PKG}/" 2>/dev/null || true

          cd dist
          tar czf "${PKG}.tar.gz" "${PKG}"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
          echo "Package: $(du -sh ${PKG}.tar.gz | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.create_release == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec mv {} release/ \;
          ls -lh release/

      - name: Generate release notes
        run: |
          VERSION="${{ github.event.inputs.version }}"
          cat > release-notes.md << EOF
          ## Xray Panel ${VERSION}

          > 此版本由 Flexible Build 工作流构建（架构: ${{ github.event.inputs.architectures }}）

          ### 在线安装

          \`\`\`bash
          bash <(curl -Ls https://raw.githubusercontent.com/${{ github.repository }}/master/scripts/install.sh) install
          \`\`\`

          ### 本地安装

          \`\`\`bash
          tar xzf xray-panel-${VERSION}-linux-amd64.tar.gz
          cd xray-panel-${VERSION}-linux-amd64
          bash scripts/install.sh install
          \`\`\`
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: true          # flexible build 默认标记为 pre-release
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build linux-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'   # 从 go.mod 读取，不写死版本
          cache: true

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          go build -trimpath \
            -ldflags="-s -w \
              -X main.Version=${{ github.event.inputs.version }} \
              -X main.BuildTime=${BUILD_TIME}" \
            -o "dist/panel-linux-${{ matrix.arch }}" \
            ./cmd/panel
          echo "Binary size: $(du -sh dist/panel-linux-${{ matrix.arch }} | cut -f1)"

      - name: Package
        run: |
          VERSION="${{ github.event.inputs.version }}"
          ARCH="${{ matrix.arch }}"
          PKG="xray-panel-${VERSION}-linux-${ARCH}"

          mkdir -p "dist/${PKG}/conf" "dist/${PKG}/scripts"

          # 二进制
          cp "dist/panel-linux-${ARCH}" "dist/${PKG}/"
          chmod +x "dist/${PKG}/panel-linux-${ARCH}"

          # 配置模板（只保留通用示例）
          cp conf/config.yaml.example "dist/${PKG}/conf/"

          # 脚本
          cp scripts/install.sh "dist/${PKG}/scripts/"
          chmod +x "dist/${PKG}/scripts/install.sh"

          # 根目录管理脚本（方便直接在包内调用）
          cp xray-panel.sh "dist/${PKG}/"
          chmod +x "dist/${PKG}/xray-panel.sh"

          # 文档
          cp README.md "dist/${PKG}/" 2>/dev/null || true

          # 打包 + 校验
          cd dist
          tar czf "${PKG}.tar.gz" "${PKG}"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
          echo "Package: $(du -sh ${PKG}.tar.gz | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec mv {} release/ \;
          echo "Release files:"
          ls -lh release/

      - name: Generate release notes
        run: |
          VERSION="${{ github.event.inputs.version }}"
          cat > release-notes.md << EOF
          ## Xray Panel ${VERSION}

          ### 下载

          | 平台 | 文件 |
          |------|------|
          | Linux AMD64 | \`xray-panel-${VERSION}-linux-amd64.tar.gz\` |
          | Linux ARM64 | \`xray-panel-${VERSION}-linux-arm64.tar.gz\` |

          ### 校验

          \`\`\`bash
          sha256sum -c xray-panel-${VERSION}-linux-amd64.tar.gz.sha256
          \`\`\`

          ### 在线安装

          \`\`\`bash
          bash <(curl -Ls https://raw.githubusercontent.com/${{ github.repository }}/master/scripts/install.sh) install
          \`\`\`

          ### 本地安装

          \`\`\`bash
          tar xzf xray-panel-${VERSION}-linux-amd64.tar.gz
          cd xray-panel-${VERSION}-linux-amd64
          bash scripts/install.sh install
          \`\`\`

          ### 首次启动

          服务安装后**未自动启动**，请先检查配置文件再启动：

          \`\`\`bash
          # 检查配置
          cat /opt/xray-panel/conf/config.yaml

          # 启动服务
          systemctl start xray-panel

          # 查看管理员账户
          cd /opt/xray-panel && ./panel admin
          \`\`\`
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
